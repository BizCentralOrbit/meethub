<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetHub - Unified Meeting Dashboard</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0F172A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <!-- FullCalendar from CDN -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <div class="header-left">
        <h1>📅 MeetHub</h1>
        <span class="subtitle">Unified Meeting Dashboard</span>
      </div>
      <div class="header-right">
        <button id="btn-refresh" class="btn btn-icon" title="Refresh calendars">🔄</button>
        <button id="btn-notifications" class="btn btn-icon" title="Enable notifications">🔔</button>
        <span id="last-sync" class="sync-label"></span>
      </div>
    </header>

    <!-- Upcoming Meetings Bar -->
    <section id="upcoming-bar">
      <h2>⏰ Coming Up</h2>
      <div id="upcoming-list" class="upcoming-list">
        <p class="muted">Loading meetings...</p>
      </div>
    </section>

    <!-- Calendar Filters -->
    <section id="filters">
      <div id="calendar-filters" class="filter-chips"></div>
    </section>

    <!-- Main Calendar -->
    <main id="calendar-container">
      <div id="calendar"></div>
    </main>

    <!-- Event Detail Modal -->
    <div id="event-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <button class="modal-close">&times;</button>
        <div id="modal-body"></div>
      </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading" class="loading-overlay">
      <div class="spinner"></div>
      <p>Fetching your calendars...</p>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
